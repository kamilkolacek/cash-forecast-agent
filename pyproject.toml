[project]
name = "cashforecast"
version = "0.0.1"
description = "Claude Code agent for 13-week direct-method cash forecasting on synthetic SaaS data"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kamil Kolacek" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "openpyxl>=3.1",
    "plotly>=5.20",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7", "types-PyYAML"]

[project.scripts]
cashforecast = "cashforecast.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cashforecast"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["eval: agent evals requiring ANTHROPIC_API_KEY (skipped by default)"]
addopts = "-m 'not eval'"
