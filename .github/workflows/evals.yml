name: Agent evals

# Manual or nightly only, so public forks and PRs cannot trigger API spend.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

jobs:
  evals:
    if: github.repository == 'kamilkolacek/cash-forecast-agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest -m eval tests/evals
